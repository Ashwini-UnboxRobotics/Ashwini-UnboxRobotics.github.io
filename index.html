<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ashwini Kumar · Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Figtree", "Segoe UI", system-ui, sans-serif;
    --slate: #314552;
    --teal: #00A896;
    --cyan: #12D3C6;
    --sky: #25A9E0;
    --ice: #8CD7E5;
    --soft-teal: #49BEB7;
    --mid-sky: #53BFEF;
    --bg-1: #1c2a33;
    --bg-2: #314552;
    --blob-a: var(--teal);
    --blob-b: var(--sky);
    --blob-c: var(--cyan);
    --glass: rgba(255, 255, 255, 0.14);
    --glass-strong: rgba(255, 255, 255, 0.22);
    --glass-border: rgba(255, 255, 255, 0.35);
    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.72);
    --menubar: rgba(20, 30, 40, 0.28);
    --btn: rgba(255, 255, 255, 0.92);
    --btn-text: #314552;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg-1: #e8f6f8; --bg-2: #d3eef3;
    --glass: rgba(255,255,255,0.45); --glass-strong: rgba(255,255,255,0.6);
    --glass-border: rgba(255,255,255,0.85); --text: #314552; --text-soft: rgba(49,69,82,0.7);
    --menubar: rgba(255,255,255,0.4); --btn: #314552; --btn-text: #ffffff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-1: #e8f6f8; --bg-2: #d3eef3;
      --glass: rgba(255,255,255,0.45); --glass-strong: rgba(255,255,255,0.6);
      --glass-border: rgba(255,255,255,0.85); --text: #314552; --text-soft: rgba(49,69,82,0.7);
      --menubar: rgba(255,255,255,0.4); --btn: #314552; --btn-text: #ffffff;
    }
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    font-family: var(--font);
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Wallpaper blobs */
  .wallpaper { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.75; }
  .blob.a { width: 46vmax; height: 46vmax; background: var(--blob-a); top: -12vmax; right: -10vmax; }
  .blob.b { width: 40vmax; height: 40vmax; background: var(--blob-b); bottom: -14vmax; left: -8vmax; }
  .blob.c { width: 28vmax; height: 28vmax; background: var(--blob-c); top: 40%; left: 45%; opacity: 0.5; }
  @media (prefers-reduced-motion: no-preference) {
    .blob.a { animation: drift 22s ease-in-out infinite alternate; }
    .blob.b { animation: drift 26s ease-in-out infinite alternate-reverse; }
    .blob.c { animation: drift 30s ease-in-out infinite alternate; }
  }
  @keyframes drift { to { transform: translate(-6vmax, 5vmax) scale(1.08); } }

  /* Menu bar */
  .menubar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 18px 6px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 500;
    background: var(--menubar);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
  }
  .menubar .left { display: flex; gap: 18px; }
  .menubar .left strong { font-weight: 700; }
  .menubar .muted { color: var(--text-soft); }

  /* Stage */
  .stage {
    position: relative; z-index: 1; height: 100%;
    display: grid; place-items: center; padding: 64px 20px 32px;
  }

  /* Glass window */
  .window {
    position: relative;
    width: min(440px, 100%);
    border-radius: 22px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    box-shadow: 0 30px 80px -20px rgba(28, 42, 51, 0.55), inset 0 1px 0 rgba(255,255,255,0.4);
    overflow: hidden;
  }
  .window::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,0.22), transparent 60%);
  }
  @media (prefers-reduced-motion: no-preference) {
    .window { animation: open 0.6s cubic-bezier(.2,.9,.3,1.2) both; }
  }
  @keyframes open { from { opacity: 0; transform: scale(0.92) translateY(12px); } }

  .titlebar { display: flex; align-items: center; padding: 14px 16px; position: relative; }
  .lights { display: flex; gap: 8px; }
  .lights span { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.25); }
  .lights span:nth-child(1) { background: #ff5f57; }
  .lights span:nth-child(2) { background: #febc2e; }
  .lights span:nth-child(3) { background: #28c840; }
  .titlebar .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 600; color: var(--text-soft);
  }

  .content { padding: 18px 32px 32px; text-align: center; position: relative; }
  .avatar {
    width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 34px; font-weight: 700; letter-spacing: -0.02em; color: #fff;
    background: linear-gradient(140deg, var(--teal) 0%, var(--cyan) 50%, var(--sky) 100%);
    box-shadow: 0 10px 30px -8px rgba(18, 211, 198, 0.55), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  h1 { font-size: clamp(28px, 6vw, 34px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
  .org { margin-top: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: var(--ice); }
  :root[data-theme="light"] .org { color: var(--slate); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .org { color: var(--slate); } }


  .email-row {
    margin-top: 28px; display: flex; align-items: center; gap: 10px;
    padding: 6px 6px 6px 16px; border-radius: 14px;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
  }
  .email-row a {
    flex: 1; min-width: 0; text-align: left; color: var(--text); text-decoration: none;
    font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .email-row a:hover { text-decoration: underline; text-underline-offset: 3px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 10px; padding: 9px 14px;
    background: var(--btn); color: var(--btn-text);
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 8px; }

  .send {
    display: block; margin-top: 12px; padding: 13px; border-radius: 14px;
    background: transparent; border: 1px solid var(--glass-border);
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .send:hover { background: var(--glass-strong); }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 4;
    transform: translate(-50%, 20px); opacity: 0;
    padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 500;
    background: var(--glass-strong); border: 1px solid var(--glass-border); color: var(--text);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .menubar .hide-sm { display: none; }
    .content { padding: 12px 22px 26px; }
  }
</style>
</head>
<body>
  <div class="wallpaper" aria-hidden="true">
    <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  </div>

  <header class="menubar">
    <div class="left">
      <strong>Contacts</strong>
      <span class="muted hide-sm">Unbox Robotics</span>
    </div>
    <span id="clock" class="muted"></span>
  </header>

  <main class="stage">
    <section class="window" id="win" aria-label="Contact card">
      <div class="titlebar">
        <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="title">Office contact</span>
      </div>
      <div class="content">
        <div class="avatar" aria-hidden="true">A</div>
        <h1>Ashwini Kumar</h1>
        <p class="org">UNBOX ROBOTICS</p>

        <div class="email-row">
          <a id="email" href="mailto:ashwini.kumar@unboxrobotics.com">ashwini.kumar@unboxrobotics.com</a>
          <button id="copy" type="button">Copy</button>
        </div>
        <a class="send" href="mailto:ashwini.kumar@unboxrobotics.com">Send an email</a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const EMAIL = "ashwini.kumar@unboxrobotics.com";

  // Menu bar clock
  const clock = document.getElementById("clock");
  function tick() {
    const d = new Date();
    clock.textContent = d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })
      + "  " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  tick(); setInterval(tick, 15000);

  // Copy email
  const toast = document.getElementById("toast");
  const copyBtn = document.getElementById("copy");
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(EMAIL);
    } catch (e) {
      const t = document.createElement("textarea");
      t.value = EMAIL; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (_) {}
      t.remove();
    }
    copyBtn.textContent = "Copied";
    showToast("Email copied to clipboard");
    setTimeout(() => (copyBtn.textContent = "Copy"), 1800);
  });

  // Light that follows the cursor across the glass
  const win = document.getElementById("win");
  win.addEventListener("pointermove", (e) => {
    const r = win.getBoundingClientRect();
    win.style.setProperty("--mx", (e.clientX - r.left) + "px");
    win.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
</script>
</body>
</html>
